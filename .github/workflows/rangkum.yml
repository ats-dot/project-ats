name: Buat Rangkuman Kode
on:
  push:
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rangkum:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan alat Graphify
        run: pip install graphifyy

      - name: Buat rangkuman otomatis
        run: |
          mkdir -p graphify-out
          graphify . --no-viz || true
          python3 - << 'EOF'
          import os, re

          out_dir = "graphify-out"
          report_path = os.path.join(out_dir, "GRAPH_REPORT.md")

          if not os.path.exists(report_path) or os.path.getsize(report_path) < 100:
              lines = ["# Peta Struktur & Rangkuman Proyek\n"]
              skip = {'.git', '.github', 'graphify-out', 'node_modules', 'build', '.gradle', '.idea'}
              exts = ('.kt', '.java', '.xml', '.gradle', '.kts', '.html', '.js', '.css', '.py', '.json')
              
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in sorted(dirs) if d not in skip]
                  for f in sorted(files):
                      if f.endswith(exts):
                          p = os.path.join(root, f).lstrip("./")
                          content = open(p, encoding='utf-8', errors='ignore').read()
                          lines_list = content.splitlines()
                          lines.append(f"## `{p}` ({len(lines_list)} baris)")
                          
                          items = []
                          for idx, line in enumerate(lines_list, 1):
                              m = re.search(r'\b(class|interface|object|fun|function|def)\s+([a-zA-Z0-9_]+)', line)
                              if m:
                                  items.append(f"- Baris {idx}: `{m.group(1)} {m.group(2)}`")
                              elif f.endswith('.xml'):
                                  m_id = re.search(r'android:id="@+id/([a-zA-Z0-9_]+)"', line)
                                  if m_id:
                                      items.append(f"- Baris {idx}: ID `@+id/{m_id.group(1)}`")
                          if items:
                              lines.extend(items)
                          lines.append("")
              with open(report_path, "w", encoding="utf-8") as out:
                  out.write("\n".join(lines))
          EOF

      - name: Simpan hasil rangkuman ke dalam repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          git commit -m "Update rangkuman kode [skip ci]" || exit 0
          git push
